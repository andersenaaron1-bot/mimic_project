name: Build Train Overlay Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCR tag for ehr-train image"
        required: true
        default: "train-overlay-latest"
      ngc_tag:
        description: "Base NGC PyTorch tag"
        required: true
        default: "24.10-py3"
      push_sha_tag:
        description: "Also push sha-<commit> tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/ehr-train"
          TAGS="${IMAGE}:${{ inputs.tag }}"
          if [[ "${{ inputs.push_sha_tag }}" == "true" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:sha-${GITHUB_SHA::12}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.train_overlay
          push: true
          build-args: |
            NGC_TAG=${{ inputs.ngc_tag }}
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
