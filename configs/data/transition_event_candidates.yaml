# Candidate transition-event registry for window segmentation development.
#
# This file is descriptive rather than prescriptive. The active window-audit logic
# currently consumes `transition_map` from `structural_codes.yaml`; this registry
# records the broader MIMIC/MEDS transition landscape that should inform future
# boundary policy revisions.

hard_regime_candidates:
  - code: "MEDS_BIRTH"
    source_norm: "MEDS synthetic"
    class: "PROLOGUE"
    default_action: "suppress"
    rationale: "Timeline origin only; not a care-regime boundary."
  - code: "ED_REGISTRATION"
    source_norm: "MEDS synthetic"
    class: "REGIME_ENTER"
    default_action: "open_next"
    rationale: "Strong ED regime anchor."
  - code: "ED_OUT"
    source_norm: "MEDS synthetic"
    class: "REGIME_EXIT"
    default_action: "close_current"
    rationale: "Strong ED regime exit."
  - code: "HOSPITAL_ADMISSION"
    source_norm: "MEDS synthetic prefix"
    class: "REGIME_ENTER"
    default_action: "open_next"
    rationale: "Hospital regime start; codes usually carry location/source suffixes."
  - code: "HOSPITAL_DISCHARGE"
    source_norm: "MEDS synthetic prefix"
    class: "REGIME_EXIT"
    default_action: "close_current"
    rationale: "Terminal hospital exit; destination suffixes are informative but not boundary-defining."
  - code: "ICU_ADMISSION"
    source_norm: "MEDS synthetic"
    class: "REGIME_ENTER"
    default_action: "open_next"
    rationale: "High-value ICU regime start when present."
  - code: "ICU_DISCHARGE"
    source_norm: "MEDS synthetic"
    class: "REGIME_EXIT"
    default_action: "close_current"
    rationale: "High-value ICU regime end when present."
  - code: "TRANSFER_TO"
    source_norm: "MEDS synthetic prefix"
    class: "REGIME_SWITCH"
    default_action: "close_open"
    rationale: "Unit/care-setting transfer; suffixes determine exact source/destination."
  - code: "ADMISSION"
    source_norm: "structural codebook seed"
    class: "REGIME_ENTER"
    default_action: "open_next"
    rationale: "Semantic boundary label for admission-derived structural overlays."
  - code: "DISCHARGE"
    source_norm: "structural codebook seed"
    class: "REGIME_EXIT"
    default_action: "close_current"
    rationale: "Semantic boundary label for discharge-derived structural overlays."
  - code: "CAREUNIT_CHANGE"
    source_norm: "structural codebook seed"
    class: "REGIME_SWITCH"
    default_action: "close_open"
    rationale: "Explicit care-unit regime change."
  - code: "STRUCT_START_OR"
    source_norm: "structural codebook label"
    class: "REGIME_ENTER"
    default_action: "open_next"
    rationale: "OR/peri-op entry boundary."
  - code: "STRUCT_END_OR"
    source_norm: "structural codebook label"
    class: "REGIME_EXIT"
    default_action: "close_current"
    rationale: "OR/peri-op exit boundary."
  - code: "MEDS_DEATH"
    source_norm: "MEDS synthetic"
    class: "REGIME_EXIT"
    default_action: "close_current"
    rationale: "Terminal exit event."

