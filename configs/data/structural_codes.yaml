# Structural codebook for generating STRUCTURAL marker tokens.
#
# - Every code in `structural_map` emits a STRUCTURAL token.
# - Only labels listed in `window_boundary_labels` are treated as window boundaries
#   (i.e., they receive `window_hook` and will split windows in the collator).
# - All other structural tokens act as in-window overlay markers (e.g., MV/vaso/RRT
#   phases that may start/end within a higher-level care-setting window).

structural_map:
  # LOCATION / CARE TRANSITIONS (prefer transfers/icustays-derived)
  "ADMISSION": "STRUCT_START_ADM"
  "DISCHARGE": "STRUCT_END_ADM"
  "CAREUNIT_CHANGE": "STRUCT_CAREUNIT_CHANGE"
  "STRUCT_START_OR": "STRUCT_START_OR"
  "STRUCT_END_OR": "STRUCT_END_OR"

  # RESP SUPPORT
  "224385": "STRUCT_START_MECH"   # Intubation
  "227194": "STRUCT_END_MECH"     # Extubation
  "NIV_START": "STRUCT_START_NIV"
  "NIV_END": "STRUCT_END_NIV"
  "HFNC_START": "STRUCT_START_HFNC"
  "HFNC_END": "STRUCT_END_HFNC"

  # CIRCULATION
  "221906": "STRUCT_START_SHOCK"  # Norepinephrine
  "221289": "STRUCT_START_SHOCK"  # Epinephrine
  "221749": "STRUCT_START_SHOCK"  # Phenylephrine
  "VASO_OFF": "STRUCT_END_SHOCK"

  # RENAL
  "225802": "STRUCT_START_RRT"    # Dialysis Cath Placed
  "225441": "STRUCT_START_RRT"    # Hemodialysis Procedure
  "225803": "STRUCT_END_RRT"      # Dialysis Cath Out
  "CRRT_START": "STRUCT_START_CRRT"
  "CRRT_END": "STRUCT_END_CRRT"

  # SURGERY / RECOVERY (site-specific)
  "225402": "STRUCT_START_REC"    # OR Received (Recovery start)

  # GOALS OF CARE
  "CODE_STATUS_CHANGE": "STRUCT_CODE_STATUS_CHANGE"

# Which structural labels should split the timeline into new windows.
# Everything else in `structural_map` becomes an in-window overlay marker.
window_boundary_labels:
  - "STRUCT_START_ADM"
  - "STRUCT_CAREUNIT_CHANGE"
  - "STRUCT_START_OR"
  - "STRUCT_END_OR"
  - "STRUCT_END_ADM"

# Optional: ensure these rare-but-critical events emit structural markers.
soft_signifiers:
  - "CPR_EVENT"
  - "DEFIB_EVENT"
  - "SEPSIS_BUNDLE_ON"
  - "TRACH_PLACED"
  - "MASSIVE_TRANSFUSION"
  - "REINTUBATION_72H"

structural_only:
  - "224385"
  - "227194"
  - "225802"
  - "225441"
  - "225803"

keep_original:
  - "221906"
  - "221289"
  - "221749"
  - "225402"
  - "ADMISSION"
  - "DISCHARGE"
