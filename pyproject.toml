[tool.poetry]
name = "mimic_project"
version = "0.1.0"
description = "Scripts for analyzing MIMIC data"
authors = ["Richard Guse <richard.guse@kit.edu>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "mimic_project" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.0"
scikit-learn = "^1.4.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
jupyter = "^1.0.0"
numpy = "^2.2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0"
flake8 = "^7.0"
mypy = "^1.9"
ipykernel = "^6.29"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"